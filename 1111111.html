  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const materialButtons = document.querySelectorAll(".material-select");
      const panels = document.querySelectorAll("[data-material-panel]");
      const cards = document.querySelectorAll("[data-material-card]");

      materialButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.target;

          panels.forEach((panel) => {
            panel.classList.toggle("hidden", panel.dataset.materialPanel !== target);
          });

          cards.forEach((card) => {
            card.classList.toggle("is-active", card.dataset.materialCard === target);
          });

          materialButtons.forEach((item) => {
            item.setAttribute("aria-selected", String(item === button));
          });
        });
      });

      document.querySelectorAll(".faq-trigger").forEach((trigger) => {
        trigger.addEventListener("click", () => {
          const item = trigger.closest(".faq-item");
          const isOpen = item.classList.toggle("is-open");
          trigger.setAttribute("aria-expanded", String(isOpen));
        });
      });
    });
  </script>
